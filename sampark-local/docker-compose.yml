name: sampark

# Extra wp-config-instellingen; WordPress leest ze bij elke request uit de omgeving,
# dus de site én wp-cli moeten ze allebei krijgen (anders draait wp-cli als "production").
x-wp-config-extra: &wp-config-extra |
  define('WP_ENVIRONMENT_TYPE', 'local');
  define('WP_DEBUG', true);
  define('WP_DEBUG_LOG', true);
  define('WP_DEBUG_DISPLAY', false);
  define('WP_MEMORY_LIMIT', '512M');

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-sampark}
      MARIADB_USER: ${DB_USER:-sampark}
      MARIADB_PASSWORD: ${DB_PASSWORD:-sampark}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8600}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-sampark}
      WORDPRESS_DB_USER: ${DB_USER:-sampark}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-sampark}
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
    volumes:
      - wp_data:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./php.ini:/usr/local/etc/php/conf.d/sampark.ini:ro

  # Eenmalig/handmatig: docker compose run --rm wpcli <wp-commando>
  wpcli:
    image: wordpress:cli-php8.3
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-sampark}
      WORDPRESS_DB_USER: ${DB_USER:-sampark}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-sampark}
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
      WP_URL: ${WP_URL:-http://localhost:8600}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-dev@positie1.local}
      ADOBE_FONTS_PROJECT: ${ADOBE_FONTS_PROJECT:-nnd7fbm}
      GTM_ID: ${GTM_ID:-}
      PMA_PORT: ${PMA_PORT:-8601}
      MAIL_PORT: ${MAIL_PORT:-8602}
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./php.ini:/usr/local/etc/php/conf.d/sampark.ini:ro
      - ./scripts:/scripts:ro
      - ./elementor:/elementor:ro
      - ./assets:/assets:ro
      - ./jetengine:/jetengine
      - ./superforms:/superforms:ro
      - ./snippets:/snippets:ro
      - ./content:/content:ro
      - ./plugins/premium:/premium:ro
      - ./backups:/backups

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${PMA_PORT:-8601}:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 256M

  # Vangt alle mail van WordPress/WooCommerce/Superforms af
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAIL_PORT:-8602}:8025"

volumes:
  db_data:
  wp_data:
